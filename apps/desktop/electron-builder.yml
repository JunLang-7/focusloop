appId: dev.focusloop.desktop
productName: FocusLoop
executableName: FocusLoop
copyright: FocusLoop contributors

directories:
  output: release
  # `resources/` holds committed icons, not build output.
  # `build/` is gitignored, which is why the mark does not live there.
  buildResources: resources

files:
  - dist/**/*
  - package.json

# The file readers load their own assets from beside themselves at runtime: `tesseract.js` reads its
# worker script and its WebAssembly core out of its own directory, and `@tesseract.js-data/*` points at
# the language data inside its own. Both work from `node_modules` on disk and not from inside the asar
# archive, so they are unpacked beside it.
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/@tesseract.js-data/**
  - node_modules/pdf-parse/**
  - node_modules/mammoth/**

extraMetadata:
  main: dist/main/main.cjs

# The window reads its icon at runtime, so carry it beside the asar.
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  - from: ../../docs/licenses/deepseek-harness-MIT.txt
    to: licenses/deepseek-harness-MIT.txt

mac:
  icon: resources/icon.icns
  # Ad-hoc signing (`-`), not `null`. There is no Apple Developer account behind
  # this project yet, so the app cannot carry a Developer ID signature and a
  # downloaded copy still needs right-click → Open. What ad-hoc signing buys is
  # a *complete* bundle signature. `identity: null` left the bundle with only
  # the linker's signature on the executable and no `CodeResources` at all, so
  # `codesign --verify --strict` failed and macOS reported the app as damaged
  # rather than merely unidentified — and "damaged" is not something a learner
  # can clear with right-click. Measured on the arm64 dmg: before, the bundle
  # had `Sealed Resources=none`; after, strict verification passes and
  # `Contents/_CodeSignature/CodeResources` is written.
  #
  # `hardenedRuntime` is off because the hardened runtime with an ad-hoc
  # signature enforces library validation, which stops an Electron app launching
  # unless it also carries `com.apple.security.cs.disable-library-validation`.
  # Notarization will need the hardened runtime back on with a real entitlements
  # file — a change for the day a certificate exists, not for today.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: FocusLoop-Setup-${arch}.${ext}

linux:
  icon: resources/icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
        # Windows on ARM has no x64 emulation guarantee for every host, and an
        # arm64 build is the only way to serve those machines natively. It is a
        # separate installer, so the two cannot overwrite each other.
        - arm64
  icon: resources/icon.ico
  # `${arch}` keeps the two installers apart: `FocusLoop-Setup-x64.exe` and
  # `FocusLoop-Setup-arm64.exe`. The unqualified `FocusLoop-Setup.exe` name is
  # gone; the README, publishing guide and execution plan name the new files.
  artifactName: FocusLoop-Setup-${arch}.${ext}
  # The v0.1 demo installer is unsigned. `signAndEditExecutable: false`
  # skips executable editing too, leaving Electron's icon and metadata.
  # That step requires winCodeSign, whose symlinks need admin rights on Windows.
  #
  # `signExecutable: false` skips signing while rcedit applies our icon and
  # metadata. If the toolchain cannot be fetched or extracted, fall back to
  # `signAndEditExecutable: false`. The installer, uninstaller and
  # Add/Remove Programs still use the `nsis` icons below, but shortcuts to
  # the executable lose its embedded icon.
  signExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Explicit icons for the installer, its header and Add/Remove Programs.
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
