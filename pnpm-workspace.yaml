packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'

# Dependencies allowed to run install scripts. Keep this list explicit and short.
allowBuilds:
  esbuild: true
  nx: true
  electron: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
  better-sqlite3: set this to true or false
