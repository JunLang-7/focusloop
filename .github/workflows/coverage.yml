name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# Measures and reports; it never writes to the repository.
permissions:
  contents: read

jobs:
  coverage:
    name: coverage (domain packages)
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on 19 October 2026
    # (actions/runner-images#14748). 24.04 is the image it points at today and is an LTS; the reasoning
    # is written out in `ci.yml`'s `quality` job (#18).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from `packageManager` in package.json, so it is not repeated here.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each package declares its own floor in `vitest.config.ts`, so this fails when a package stops
      # exercising a rule rather than when the workspace average moves. `pipefail` is set explicitly:
      # the default shell here does not, and without it `tee` would swallow the exit code.
      - name: Measure
        run: |
          set -o pipefail
          pnpm coverage 2>&1 | tee coverage.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
