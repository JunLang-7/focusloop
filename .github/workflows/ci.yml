name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs only read the repository: they check out the pull request's code, run it and report.
# Leaving this unset would inherit the repository default, which is more than they need.
permissions:
  contents: read

env:
  # The Node version is not repeated here: every job reads `.nvmrc`, which is the file a
  # developer's own tooling already reads.
  PNPM_VERSION: '11.4.0'

jobs:
  quality:
    name: quality (${{ matrix.os }})
    # The product ships on Windows, is developed on macOS and is built on Linux runners, so the
    # gates run where each of those facts matters. `fail-fast: false` so that one platform's failure
    # does not hide what the other two have to say.
    #
    # Linux is pinned rather than left on `ubuntu-latest`. On 19 October 2026 that label migrates to
    # Ubuntu 26 (actions/runner-images#14748), and a runner image is not something to find out about
    # from a red build on the day it moves: nothing in this repository asked for a new OS.
    #
    # This is not a move to a different image; it is the same image, named. `ubuntu-24.04` is what
    # `ubuntu-latest` points at today, so no gate here runs anywhere new — the job that said
    # `ubuntu-latest` and the job that says `ubuntu-24.04` are one job on one image. The argument is
    # asymmetric on purpose: that is safe by observation, where pinning to any *other* image — 22.04, or
    # a 26 preview — would be an unverified change no run here has exercised. 24.04 is also an LTS with
    # a long support window, so this is a supported place to sit rather than a stopgap.
    #
    # It defers the move rather than refusing it: whoever wants 26 changes this one label and lets a run
    # answer for it. The Windows and macOS labels are left alone because neither has an announced
    # migration — pinning a label that has not been observed moving is a different decision, and this
    # repository pins no label today, so that standard is not being quietly introduced here (#18).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Formatting
        run: pnpm format:check

      - name: Release hygiene
        run: pnpm verify:scaffolding

      - name: Workflow hygiene
        run: pnpm verify:workflows

      - name: Documentation drift
        run: pnpm verify:docs

      - name: Theme invariants
        run: pnpm verify:tokens

  e2e:
    name: golden path (${{ matrix.os }})
    # Two platforms, neither of which needs a display: Windows is what the project ships, macOS is
    # where it is developed and where the design captures are taken. Linux would need xvfb and
    # `--no-sandbox`, and it is not a platform the product is delivered on.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm --filter @focusloop/desktop run build

      - name: Golden path
        run: pnpm e2e
        env:
          CI: 'true'

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/desktop-e2e/test-results/
          retention-days: 7

  package:
    name: package (smoke)
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on 19 October 2026
    # (actions/runner-images#14748). 24.04 is the image it points at today and is an LTS; the reasoning
    # is written out in this file's `quality` job (#18).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The release workflow is the only place these two commands used to run, which meant a broken
      # packaging configuration was discovered while cutting a release. `package:dir` runs
      # electron-builder without the installer, so it needs no wine and no signing toolchain.
      - name: Package the app directory
        run: pnpm --filter @focusloop/desktop run package:dir

      - name: Package the extension zip
        run: pnpm --filter @focusloop/extension run build:zip

      # The paths are the contract the release workflow reads. If packaging moves its output, this
      # is where it should fail — not on the tag.
      - name: Check the artefacts the release expects
        run: |
          test -d apps/desktop/release/linux-unpacked
          test -f apps/desktop/release/linux-unpacked/resources/app.asar
          test -f apps/extension/release/focusloop-extension.zip
          ls -lh \
            apps/desktop/release/linux-unpacked/resources/app.asar \
            apps/extension/release/focusloop-extension.zip
