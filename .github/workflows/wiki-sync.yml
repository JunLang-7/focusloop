name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync-wiki.mjs'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

# Publishes to the wiki repository, which is a separate git repository — but it belongs to *this*
# repository, and the job token can write to it when the job is granted `contents: write`. There is no
# wiki-only permission to ask for instead.
#
# **Nothing has to be configured for this to work, and `WIKI_SYNC_TOKEN` is not required.** It is
# honoured if it exists as a repository secret: the override wins when it is set, and the built-in job
# token is used when it is not. The reason to keep the door open is that the built-in token's reach is
# GitHub's decision rather than ours — this workflow already believed, wrongly, that it had none — and
# a credential that only needs to be pasted in is a cheaper answer to that than a code change.
#
# The built-in path is measured rather than assumed. A push to a scratch branch of this wiki with the
# job token returns 0; the same push with an empty credential returns "Invalid username or token.
# Password authentication is not supported for Git operations." — which is the message the previous
# version of this file was reading, and why it concluded the default token could not get in. It passed
# `$GITHUB_TOKEN` from the *ambient* environment, and that variable is not exported into a `run:` step
# (its length there is 0); `${{ secrets.GITHUB_TOKEN }}` is the one that is populated.
#
# An override that is set but wrong fails loudly in the push below, which is the point: a secret that
# is silently ignored is worse than no secret, because it looks like insurance.
#
# The repository copy is the single editable source; see docs/wiki/README.md.
permissions:
  contents: write

jobs:
  publish:
    name: publish docs/wiki
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on 19 October 2026
    # (actions/runner-images#14748). 24.04 is the image it points at today and is an LTS; the reasoning
    # is written out in `ci.yml`'s `quality` job (#18).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wiki is a separate git repository. `--depth 1` is enough: every run rewrites the pages it
      # manages, so there is no history to merge with.
      #
      # `GIT_TERMINAL_PROMPT=0` and the explicit error below are both about what a *rejected* credential
      # looks like. Without them, GitHub answering 401 makes git fall through to asking for a username,
      # which in a runner fails as `fatal: could not read Username for 'https://github.com': No such
      # device or address` — a message that names a git problem and sends the reader to the wrong place.
      # Measured by setting the override to a deliberately wrong value and reading the log.
      - name: Clone the wiki
        env:
          GIT_TERMINAL_PROMPT: '0'
          # `||` is what makes the override optional: an unset (or empty) secret is falsy, so the
          # built-in token is what an unconfigured repository gets.
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          # Mapped separately so the log can name the credential that was used without printing it.
          OVERRIDE: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "Credential: the WIKI_SYNC_TOKEN repository secret."
          else
            echo "Credential: the built-in job token (no override is configured)."
          fi
          # The token goes in a per-command header rather than into the remote URL: a URL ends up in
          # `.git/config`, where any later step that archives or prints the workspace would carry it.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          set +e
          out=$(git -c http.extraheader="$auth" clone --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$RUNNER_TEMP/wiki" 2>&1)
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            printf '%s\n' "$out" | sed -E 's#https://[^ ]*#<redacted-url>#g'
            echo "::error::The credential was rejected by the wiki repository."
            if [ -n "$OVERRIDE" ]; then
              echo "::error::WIKI_SYNC_TOKEN is configured and takes precedence. Check that it has not expired or been revoked and that it may push to this repository's wiki; deleting the secret falls back to the built-in token."
            else
              echo "::error::No override is configured, so the built-in job token was used. Check this workflow's \`permissions:\`."
            fi
            exit $code
          fi

      - name: Publish
        run: node scripts/sync-wiki.mjs --target "$RUNNER_TEMP/wiki"

      - name: Push when a page changed
        env:
          GIT_TERMINAL_PROMPT: '0'
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ secrets.WIKI_SYNC_TOKEN }}
        working-directory: ${{ runner.temp }}/wiki
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No page changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "docs(wiki): publish docs/wiki @ ${GITHUB_SHA:0:7}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          set +e
          out=$(git -c http.extraheader="$auth" push 2>&1)
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            printf '%s\n' "$out" | sed -E 's#https://[^ ]*#<redacted-url>#g'
            if [ -n "$OVERRIDE" ]; then
              echo "::error::The push was rejected. WIKI_SYNC_TOKEN is configured and takes precedence; deleting it falls back to the built-in token."
            else
              echo "::error::The push was rejected with the built-in job token. Check this workflow's \`permissions:\`."
            fi
            exit $code
          fi
