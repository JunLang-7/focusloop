name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync-wiki.mjs'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

# Publishes `docs/wiki/` to the GitHub Wiki, which is a separate git repository — but it belongs to
# *this* repository, and the job token can write to it when the job is granted `contents: write`.
# There is no wiki-only permission to ask for instead.
#
# **The wiki publishes with no configuration at all.** That is measured, not assumed: a push to a
# scratch branch of this wiki with the job token returns 0, and the same push with an empty credential
# returns "Invalid username or token. Password authentication is not supported for Git operations." —
# which is the message an earlier version of this file was reading, and why it wrongly concluded the
# default token could not get in. It passed `$GITHUB_TOKEN` from the *ambient* environment, and that
# variable is not exported into a `run:` step (its length there is 0); `${{ secrets.GITHUB_TOKEN }}` is
# the one that is populated.
#
# `WIKI_SYNC_TOKEN` is an **override, never a requirement**: it is preferred when it works, and the
# built-in token publishes when it does not. That ordering is the whole point of the file, and it was
# learned the hard way — an override that was *preferred unconditionally* turned a working wiki into a
# failing workflow the moment somebody pasted a token GitHub did not accept, which is the opposite of
# what insurance is for. A rejected override now costs a warning and nothing else, and the warning names
# the secret, so it is not silently ignored either.
#
# The repository copy is the single editable source; see docs/wiki/README.md.
permissions:
  contents: write

jobs:
  publish:
    name: publish docs/wiki
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on 19 October 2026
    # (actions/runner-images#14748). 24.04 is the image it points at today and is an LTS; the reasoning
    # is written out in `ci.yml`'s `quality` job (#18).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Both credentials are read once, here: no step repeats the expression, and the log can name which
    # one was used without printing either of them.
    env:
      OVERRIDE: ${{ secrets.WIKI_SYNC_TOKEN }}
      BUILTIN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wiki is a separate git repository. `--depth 1` is enough: every run rewrites the pages it
      # manages, so there is no history to merge with.
      #
      # This step is also where the credential is *chosen*, because a rejected one fails here: GitHub
      # answers 401 and git — with `GIT_TERMINAL_PROMPT=0`, without which it falls through to asking for
      # a username and reports `could not read Username ... terminal prompts disabled` — has nowhere to
      # go. The choice is recorded for the push step, which needs the same credential.
      - name: Clone the wiki
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          # The token goes in a per-command header rather than into the remote URL: a URL ends up in
          # `.git/config`, where any later step that archives or prints the workspace would carry it.
          clone_with() {
            local header
            header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$1" | base64 -w0)"
            git -c http.extraheader="$header" clone --depth 1 \
              "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          }
          builtin() {
            echo "WIKI_TOKEN_SOURCE=builtin" >> "$GITHUB_ENV"
            clone_with "$BUILTIN"
          }

          if [ -z "$OVERRIDE" ]; then
            echo "Credential: the built-in job token (no override is configured)."
            builtin
            exit 0
          fi

          echo "Credential: the WIKI_SYNC_TOKEN repository secret."
          rm -rf "$RUNNER_TEMP/wiki"
          if clone_with "$OVERRIDE"; then
            echo "WIKI_TOKEN_SOURCE=override" >> "$GITHUB_ENV"
            exit 0
          fi

          # The override is set and GitHub did not accept it. That is a reason to say so, not a reason to
          # leave the wiki unpublished.
          #
          # Two different faults, and they need different words. A credential can be *rejected* — expired,
          # revoked, or not allowed to write — or it can be *not a credential at all*, which is what a
          # secret that never received the token looks like. The second was found in the wild: a
          # `WIKI_SYNC_TOKEN` holding a single non-alphanumeric character produced "the credential was
          # rejected by the wiki repository", which is true and sends the reader off to check scopes when
          # the actual problem is that the paste did not take. The length is printed in that branch only:
          # it is the identifying fact, and a value that short is not protecting anything.
          rm -rf "$RUNNER_TEMP/wiki"
          case "$OVERRIDE" in
            ghp_*|github_pat_*|gho_*|ghs_*)
              looks_like_credential=yes
              ;;
            *)
              # GitHub stopped issuing unprefixed classic tokens in 2021, but one may still be in use: 40
              # hex characters.
              if [ ${#OVERRIDE} -eq 40 ] && printf '%s' "$OVERRIDE" | grep -qE '^[0-9a-f]{40}$'; then
                looks_like_credential=yes
              else
                looks_like_credential=no
              fi
              ;;
          esac

          if [ "$looks_like_credential" = 'yes' ]; then
            echo "::warning::WIKI_SYNC_TOKEN was rejected by the wiki repository, so the built-in token published instead. Check that it has not expired or been revoked and that it may push to this repository's wiki; deleting the secret removes this warning."
          else
            echo "::warning::WIKI_SYNC_TOKEN does not look like a GitHub credential — the stored value is ${#OVERRIDE} character(s) with no ghp_/github_pat_/gho_/ghs_ prefix — so the built-in token published instead. The secret most likely never received the token. Set it again and check the value before storing it; docs/publishing.md has a snippet that refuses to store a value that short."
          fi
          {
            echo "### The wiki published with the built-in token"
            echo
            if [ "$looks_like_credential" = 'yes' ]; then
              echo '`WIKI_SYNC_TOKEN` is set, but the wiki repository **rejected** it, so this run used the'
              echo 'built-in token instead. Fix or delete the secret; `docs/publishing.md` has the commands.'
            else
              echo '`WIKI_SYNC_TOKEN` is set but does not look like a GitHub credential '
              echo "(${#OVERRIDE} character(s), no token prefix), so this run used the built-in token"
              echo 'instead — the secret most likely never received the token. `docs/publishing.md` has a'
              echo 'snippet that checks the value before storing it.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          builtin

      - name: Publish
        run: node scripts/sync-wiki.mjs --target "$RUNNER_TEMP/wiki"

      - name: Push when a page changed
        env:
          GIT_TERMINAL_PROMPT: '0'
        working-directory: ${{ runner.temp }}/wiki
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No page changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "docs(wiki): publish docs/wiki @ ${GITHUB_SHA:0:7}"

          push_with() {
            local header
            header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$1" | base64 -w0)"
            git -c http.extraheader="$header" push
          }

          # The same preference as the clone, for the case the clone cannot see: a credential that may
          # read the wiki but not write to it (the wiki of a public repository is readable without being
          # writable).
          if [ "$WIKI_TOKEN_SOURCE" = 'override' ]; then
            if push_with "$OVERRIDE"; then
              exit 0
            fi
            echo "::warning::WIKI_SYNC_TOKEN was rejected on push, so the built-in token pushed instead. Check that it has not expired, been revoked, or lost write access to this repository's wiki."
            if push_with "$BUILTIN"; then
              exit 0
            fi
            echo "::error::Both WIKI_SYNC_TOKEN and the built-in job token were rejected on push. Check this workflow's \`permissions:\` and the secret."
            exit 1
          fi

          if push_with "$BUILTIN"; then
            exit 0
          fi
          echo "::error::The push was rejected with the built-in job token. Check this workflow's \`permissions:\`."
          exit 1
