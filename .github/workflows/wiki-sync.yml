name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync-wiki.mjs'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

# Publishes to the wiki repository, which is a separate git repository — but it belongs to *this*
# repository, and the job token can write to it when the job is granted `contents: write`. There is no
# wiki-only permission to ask for instead; the PAT this workflow used to require carried the same
# reach (`Contents: read and write`) and added the burden of existing, being stored and being rotated.
#
# That is measured rather than assumed. A push to a scratch branch of this wiki with this token
# returns 0; the same push with an empty credential returns "Invalid username or token. Password
# authentication is not supported for Git operations." — which is the message the previous version of
# this file was reading, and why it concluded the default token could not get in. It passed
# `$GITHUB_TOKEN` from the *ambient* environment, and that variable is not exported into a `run:` step
# (its length there is 0); `${{ secrets.GITHUB_TOKEN }}` is the one that is populated.
#
# The repository copy is the single editable source; see docs/wiki/README.md.
permissions:
  contents: write

jobs:
  publish:
    name: publish docs/wiki
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on 19 October 2026
    # (actions/runner-images#14748). 24.04 is the image it points at today and is an LTS; the reasoning
    # is written out in `ci.yml`'s `quality` job (#18).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wiki is a separate git repository. `--depth 1` is enough: every run rewrites the pages it
      # manages, so there is no history to merge with.
      - name: Clone the wiki
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes in a per-command header rather than into the remote URL: a URL ends up in
          # `.git/config`, where any later step that archives or prints the workspace would carry it.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" clone --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$RUNNER_TEMP/wiki"

      - name: Publish
        run: node scripts/sync-wiki.mjs --target "$RUNNER_TEMP/wiki"

      - name: Push when a page changed
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ runner.temp }}/wiki
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No page changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "docs(wiki): publish docs/wiki @ ${GITHUB_SHA:0:7}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" push
