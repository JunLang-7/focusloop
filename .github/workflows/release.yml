name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal path. Without this, the only way to find out whether the packaging and checksum
  # steps still work was to push a tag, which is the moment the answer is most expensive.
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22.13.0'
  PNPM_VERSION: '11.4.0'

jobs:
  release:
    name: package windows + extension
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # These must stay separate steps. On Windows the default shell is pwsh, and a
      # multi-line `run:` block reports only the exit code of its LAST command — so
      # `pnpm test` could fail and the step would still go green as long as
      # `pnpm verify:scaffolding` passed. That is how a release was once packaged from
      # a commit whose tests were failing. Separate steps make each gate able to fail
      # the job, and show which one did.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Release hygiene
        run: pnpm verify:scaffolding

      - name: Package the desktop installer
        run: pnpm --filter @focusloop/desktop run package

      - name: Package the extension
        run: pnpm --filter @focusloop/extension run build:zip

      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'apps/desktop/release/FocusLoop-Setup.exe',
            'apps/extension/release/focusloop-extension.zip'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish the release
        # Only a tag may create a release. A dispatched rehearsal runs everything above and stops
        # here, because a release cannot be attached to a branch.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            apps/desktop/release/FocusLoop-Setup.exe
            apps/extension/release/focusloop-extension.zip
            SHA256SUMS.txt

      # What a rehearsal produces, so the artefacts and their checksums can be inspected without
      # publishing them anywhere.
      - name: Upload the rehearsed artefacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focusloop-release
          path: |
            apps/desktop/release/FocusLoop-Setup.exe
            apps/extension/release/focusloop-extension.zip
            SHA256SUMS.txt
          retention-days: 7
