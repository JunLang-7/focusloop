name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal path. Without this, the only way to find out whether the
  # packaging and checksum steps still work was to push a tag, which is the
  # moment the answer is most expensive.
  workflow_dispatch:

# Read by default, like every other workflow here. Only the publishing job
# writes, and it asks for `contents: write` on itself rather than granting it to
# the ten jobs that only read.
permissions:
  contents: read

env:
  NODE_VERSION: '22.13.0'
  PNPM_VERSION: '11.4.0'

jobs:
  # ---------------------------------------------------------- the CI gates
  #
  # Release calls the CI workflow instead of restating its steps. It used to
  # restate four of them and silently miss the other seven plus the whole
  # golden-path suite — nothing failed, the gates were simply absent. A gate
  # added to CI is now part of every release by construction.
  ci:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  # The deep gates live in their own workflow because the same ones run nightly.
  # Restating them here is how this file once drifted seven gates behind CI
  # without anything failing.
  deep:
    name: deep checks
    uses: ./.github/workflows/deep-checks.yml
    secrets: inherit

  # -------------------------------------------------------------- packaging
  package-windows:
    name: package windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps, for the reason the release file has always stated: on
      # Windows the default shell is pwsh, and a `;`-joined block reports only
      # the last command's exit code — a failed build could still leave the
      # step green.
      - name: Build the desktop renderer and main
        run: pnpm --filter @focusloop/desktop run build

      # Both architectures in one pass. The x64 installer serves the bulk of
      # machines; arm64 serves Windows on ARM, which has no reliable x64
      # emulation and cannot be reached any other way.
      - name: Package both architectures
        run: >-
          pnpm --filter @focusloop/desktop exec electron-builder --win
          --x64 --arm64 --config electron-builder.yml

      - name: Check the artefacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('FocusLoop-Setup-x64.exe',
                           'FocusLoop-Setup-arm64.exe')) {
            $p = Join-Path 'apps/desktop/release' $f
            if (-not (Test-Path $p)) { throw "missing $p" }
            Get-Item $p | Select-Object Name, Length
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installers
          path: apps/desktop/release/FocusLoop-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: package macos
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the desktop renderer and main
        run: pnpm --filter @focusloop/desktop run build

      # Arch flags are mandatory: without them electron-builder builds only the
      # runner's own architecture, and the x64 dmg would silently disappear from
      # the release.
      - name: Package both architectures
        run: >-
          pnpm --filter @focusloop/desktop exec electron-builder --mac dmg
          --arm64 --x64 --config electron-builder.yml

      - name: Check the artefacts
        run: |
          set -euo pipefail
          ls -lh \
            apps/desktop/release/FocusLoop-Setup-arm64.dmg \
            apps/desktop/release/FocusLoop-Setup-x64.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-installers
          path: apps/desktop/release/FocusLoop-Setup-*.dmg
          if-no-files-found: error
          retention-days: 7

  package-extension:
    name: package extension
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package the extension
        run: pnpm --filter @focusloop/extension run build:zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-zip
          path: apps/extension/release/focusloop-extension.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------- install smoke
  # Building an installer proves the toolchain ran. Installing it proves the
  # learner can. These run on the artefacts the release will actually attach,
  # not on a build directory.
  smoke-windows:
    name: install smoke (windows)
    runs-on: windows-latest
    needs: package-windows
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installers
          path: installers

      # A silent install and uninstall, twice — once per architecture. `/S` is
      # NSIS's switch; `perMachine: false` in the config means it lands in the
      # user profile and needs no elevation.
      - name: Install and uninstall each architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in @('x64', 'arm64')) {
            $setup = Resolve-Path "installers/FocusLoop-Setup-$arch.exe"
            Write-Host "::group::install $arch"
            $proc = Start-Process -FilePath $setup `
              -ArgumentList '/S' -PassThru -Wait
            if ($proc.ExitCode -ne 0) {
              throw "installer $arch exited $($proc.ExitCode)"
            }
            $exe = Join-Path $env:LOCALAPPDATA `
              'Programs/FocusLoop/FocusLoop.exe'
            if (-not (Test-Path $exe)) {
              throw "installed executable missing for $arch"
            }
            $asar = Join-Path $env:LOCALAPPDATA `
              'Programs/FocusLoop/resources/app.asar'
            if (-not (Test-Path $asar)) { throw "app.asar missing for $arch" }
            Write-Host "installed $arch -> $exe"
            Write-Host "::endgroup::"
            Write-Host "::group::uninstall $arch"
            $unins = Join-Path $env:LOCALAPPDATA `
              'Programs/FocusLoop/Uninstall FocusLoop.exe'
            if (Test-Path $unins) {
              $u = Start-Process -FilePath $unins `
                -ArgumentList '/S' -PassThru -Wait
              Write-Host "uninstall $arch exited $($u.ExitCode)"
            }
            Write-Host "::endgroup::"
          }

  smoke-macos:
    name: install smoke (macos)
    runs-on: macos-latest
    needs: package-macos
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-installers
          path: installers

      # Mount each dmg, check the bundle is complete, and confirm the binary
      # matches the advertised architecture, then detach. A read-only attach
      # needs no privileges.
      - name: Mount and inspect each dmg
        shell: bash
        run: |
          set -euo pipefail
          declare -A want=(
            [arm64]='Mach-O 64-bit executable arm64'
            [x64]='Mach-O 64-bit executable x86_64'
          )
          for arch in arm64 x64; do
            echo "::group::mount $arch"
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" \
              "installers/FocusLoop-Setup-$arch.dmg"
            app="$mnt/FocusLoop.app"
            test -d "$app"
            test -f "$app/Contents/MacOS/FocusLoop"
            test -f "$app/Contents/Resources/app.asar"
            file "$app/Contents/MacOS/FocusLoop" | grep -F "${want[$arch]}"
            hdiutil detach "$mnt" -quiet
            rmdir "$mnt"
            echo "verified $arch"
            echo "::endgroup::"
          done

  # -------------------------------------------------------------- publish
  #
  # Only a tag may create a release. A dispatched rehearsal runs everything
  # above and stops here, because a release cannot be attached to a branch — but
  # it still uploads every artefact so they can be inspected.
  publish:
    name: checksums and release
    runs-on: ubuntu-24.04
    # The one job that publishes, and the only one that needs to write.
    permissions:
      contents: write
    timeout-minutes: 20
    needs:
      - ci
      - deep
      - package-windows
      - package-macos
      - package-extension
      - smoke-windows
      - smoke-macos
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artefacts
          merge-multiple: true

      - name: Collect the release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artefacts/FocusLoop-Setup-*.exe dist/
          cp artefacts/FocusLoop-Setup-*.dmg dist/
          cp artefacts/focusloop-extension.zip dist/
          ls -lh dist

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum FocusLoop-Setup-x64.exe FocusLoop-Setup-arm64.exe \
                   FocusLoop-Setup-arm64.dmg FocusLoop-Setup-x64.dmg \
                   focusloop-extension.zip > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/FocusLoop-Setup-x64.exe
            dist/FocusLoop-Setup-arm64.exe
            dist/FocusLoop-Setup-arm64.dmg
            dist/FocusLoop-Setup-x64.dmg
            dist/focusloop-extension.zip
            SHA256SUMS.txt

      - name: Upload the rehearsed artefacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focusloop-release
          path: |
            dist/FocusLoop-Setup-x64.exe
            dist/FocusLoop-Setup-arm64.exe
            dist/FocusLoop-Setup-arm64.dmg
            dist/FocusLoop-Setup-x64.dmg
            dist/focusloop-extension.zip
            SHA256SUMS.txt
          retention-days: 7
